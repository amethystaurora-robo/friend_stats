<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Competition Statistics</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <h1>Competition Statistics</h1>
    <p>Manage avatars, competitions, points, and statistics.</p>
  </header>

  <main>
<section class="panel avatar-builder">
  <h2>Create an Avatar</h2>

  <form id="avatar-form">
    <label for="avatar-name">Avatar name</label>
    <input
      id="avatar-name"
      name="avatar-name"
      type="text"
      placeholder="Enter avatar name"
      required
    >

    <div class="avatar-builder-layout">
      <div class="avatar-options">

      
<fieldset>
  <legend>Ghost color</legend>

  <div class="choice-grid">
    <button
      type="button"
      class="choice color-choice selected"
      data-option="ghostColor"
      data-value="#ff0000"
      style="--choice-color: #ff0000"
      aria-label="Red ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#ff7f00"
      style="--choice-color: #ff7f00"
      aria-label="Orange ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#ffff00"
      style="--choice-color: #ffff00"
      aria-label="Yellow ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#008000"
      style="--choice-color: #008000"
      aria-label="Green ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#0000ff"
      style="--choice-color: #0000ff"
      aria-label="Blue ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#800080"
      style="--choice-color: #800080"
      aria-label="Purple ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#000000"
      style="--choice-color: #000000"
      aria-label="Black ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#808080"
      style="--choice-color: #808080"
      aria-label="Gray ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#8b4513"
      style="--choice-color: #8b4513"
      aria-label="Brown ghost"
    ></button>
  </div>
</fieldset>

        <fieldset>
  <legend>Mouth</legend>

  <div class="text-choice-grid">
    <button
      type="button"
      class="choice text-choice selected"
      data-option="mouth"
      data-value="grinning"
    >
      Grinning
    </button>

    <button
  type="button"
  class="choice text-choice"
  data-option="mouth"
  data-value="tongue"
>
  Tongue Out
</button>

<button
  type="button"
  class="choice text-choice"
  data-option="mouth"
  data-value="missing-tooth"
>
  Missing Tooth
</button>


    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="smile"
    >
      Smile
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="frown"
    >
      Frown
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="braces"
    >
      Braces
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="fangs"
    >
      Fangs
    </button>

  </div>
</fieldset>



<fieldset>
  <legend>Eye color</legend>

  <div class="choice-grid">
    <button
      type="button"
      class="choice color-choice selected"
      data-option="eyeColor"
      data-value="#222222"
      style="--choice-color: #222222"
      aria-label="Black eyes"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="eyeColor"
      data-value="#2563eb"
      style="--choice-color: #2563eb"
      aria-label="Blue eyes"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="eyeColor"
      data-value="#16a34a"
      style="--choice-color: #16a34a"
      aria-label="Green eyes"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="eyeColor"
      data-value="#dc2626"
      style="--choice-color: #dc2626"
      aria-label="Red eyes"
    ></button>
  </div>
</fieldset>

<fieldset>
  <legend>Accessories</legend>

  <div class="text-choice-grid">
    <button
      type="button"
      class="choice text-choice"
      data-accessory="glasses"
    >
      Glasses
    </button>

    <button
  type="button"
  class="choice text-choice"
  data-accessory="earrings"
>
  Earrings
</button>

<button
  type="button"
  class="choice text-choice"
  data-accessory="eyepatch"
>
  Eyepatch
</button>


    <button
      type="button"
      class="choice text-choice"
      data-accessory="beard"
    >
      Beard
    </button>

    <button
  type="button"
  class="choice text-choice"
  data-accessory="mustache"
>
  Mustache
</button>


    <button
      type="button"
      class="choice text-choice"
      data-accessory="horn"
    >
      Horn
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-accessory="top-hat"
    >
      Top hat
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-accessory="halo"
    >
      Halo
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-accessory="beret"
    >
      Beret
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-accessory="band"
    >
      Band
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-accessory="nose-bullring"
    >
      Bullring
    </button>
  </div>
</fieldset>

        <fieldset>
  <legend>Accessory color</legend>

  <div class="choice-grid">
    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#ff0000"
      style="--choice-color: #ff0000"
      aria-label="Red accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#ff7f00"
      style="--choice-color: #ff7f00"
      aria-label="Orange accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#ffff00"
      style="--choice-color: #ffff00"
      aria-label="Yellow accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#008000"
      style="--choice-color: #008000"
      aria-label="Green accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#0000ff"
      style="--choice-color: #0000ff"
      aria-label="Blue accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#800080"
      style="--choice-color: #800080"
      aria-label="Purple accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#000000"
      style="--choice-color: #000000"
      aria-label="Black accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#808080"
      style="--choice-color: #808080"
      aria-label="Gray accessory"
    ></button>

    <button
      type="button"
      class="choice color-choice accessory-color-choice"
      data-accessory-color="#8b4513"
      style="--choice-color: #8b4513"
      aria-label="Brown accessory"
    ></button>
  </div>
</fieldset>



        <button type="submit" class="primary-button">
          Create avatar
        </button>
      </div>

      <div class="preview-container">
        <h3>Preview</h3>
        <div id="avatar-preview"></div>
      </div>
    </div>
  </form>

</section>


    <section class="panel">
      <h2>Avatars</h2>
      <div id="avatar-list" class="avatar-list"></div>
    </section>

    <section class="panel">
      <h2>Add competition entry</h2>

      <form id="entry-form">
        <label>
          Competition type
          <input
            id="competition-type"
            type="text"
            placeholder="Football, quiz, tennis..."
            required
          >
        </label>

        <label>
          Date
          <input id="competition-date" type="date" required>
        </label>

        <label>
          Notes
          <textarea
            id="competition-notes"
            placeholder="Optional notes"
          ></textarea>
        </label>

        <h3>Points</h3>
        <div id="points-fields"></div>

        <button type="submit">Save competition</button>
      </form>
    </section>

    <section class="panel">
      <h2>Compare avatars</h2>

    <div class="comparison-controls">
      <label for="avatar-one">First avatar</label>
      <select id="avatar-one"></select>
    
      <label for="avatar-two">Second avatar</label>
      <select id="avatar-two"></select>
    
      <button id="compare-button" type="button">
        Compare
      </button>
    </div>


      <div id="comparison-result"></div>
    </section>

    <section class="panel">
      <h2>Points over time</h2>
      <canvas id="points-chart"></canvas>
    </section>

    <section class="panel">
      <h2>Competition history</h2>
      <div id="entry-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
