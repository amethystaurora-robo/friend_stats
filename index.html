<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Competition Statistics</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <h1>Competition Statistics</h1>
    <p>Manage avatars, competitions, points, and statistics.</p>
  </header>

  <main>
<section class="panel avatar-builder">
  <h2>Create an Avatar</h2>

  <form id="avatar-form">
    <label for="avatar-name">Avatar name</label>
    <input
      id="avatar-name"
      name="avatar-name"
      type="text"
      placeholder="Enter avatar name"
      required
    >

    <div class="avatar-builder-layout">
      <div class="avatar-options">

      
<fieldset>
  <legend>Ghost color</legend>

  <div class="choice-grid">
    <button
      type="button"
      class="choice color-choice selected"
      data-option="ghostColor"
      data-value="#ff0000"
      style="--choice-color: #ff0000"
      aria-label="Red ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#ff7f00"
      style="--choice-color: #ff7f00"
      aria-label="Orange ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#ffff00"
      style="--choice-color: #ffff00"
      aria-label="Yellow ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#008000"
      style="--choice-color: #008000"
      aria-label="Green ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#0000ff"
      style="--choice-color: #0000ff"
      aria-label="Blue ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#800080"
      style="--choice-color: #800080"
      aria-label="Purple ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#000000"
      style="--choice-color: #000000"
      aria-label="Black ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#808080"
      style="--choice-color: #808080"
      aria-label="Gray ghost"
    ></button>

    <button
      type="button"
      class="choice color-choice"
      data-option="ghostColor"
      data-value="#8b4513"
      style="--choice-color: #8b4513"
      aria-label="Brown ghost"
    ></button>
  </div>
</fieldset>

        <fieldset>
  <legend>Mouth</legend>

  <div class="text-choice-grid">
    <button
      type="button"
      class="choice text-choice selected"
      data-option="mouth"
      data-value="grinning"
    >
      Grinning
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="smile"
    >
      Smile
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="frown"
    >
      Frown
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="braces"
    >
      Braces
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="fangs"
    >
      Fangs
    </button>

    <button
      type="button"
      class="choice text-choice"
      data-option="mouth"
      data-value="tiger"
    >
      Tiger
    </button>
  </div>
</fieldset>



        <fieldset>
          <legend>Eye color</legend>

          <div class="choice-grid">
            <button
              type="button"
              class="choice color-choice selected"
              data-option="eyeColor"
              data-value="#222222"
              style="--choice-color: #222222"
              aria-label="Black eyes"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="eyeColor"
              data-value="#2563eb"
              style="--choice-color: #2563eb"
              aria-label="Blue eyes"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="eyeColor"
              data-value="#16a34a"
              style="--choice-color: #16a34a"
              aria-label="Green eyes"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="eyeColor"
              data-value="#dc2626"
              style="--choice-color: #dc2626"
              aria-label="Red eyes"
            ></button>
          </div>
        </fieldset>

       <div class="text-choice-grid">
  <button
    type="button"
    class="choice text-choice selected"
    data-option="accessory"
    data-value="none"
  >
    None
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="glasses"
  >
    Glasses
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="beard"
  >
    Beard
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="horn"
  >
    Horn
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="top-hat"
  >
    Top hat
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="halo"
  >
    Halo
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="beret"
  >
    Beret
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="band"
  >
    Band
  </button>

  <button
    type="button"
    class="choice text-choice"
    data-option="accessory"
    data-value="nose-bullring"
  >
    Bullring
  </button>
</div>


        <button type="submit" class="primary-button">
          Create avatar
        </button>
      </div>

      <div class="preview-container">
        <h3>Preview</h3>
        <div id="avatar-preview"></div>
      </div>
    </div>
  </form>

       <div class="preview-container">
        <h3>Preview</h3>
        <div id="avatar-preview"></div>
      </div>
    </div>
  </form>
</section>


    <section class="panel">
      <h2>Avatars</h2>
      <div id="avatar-list" class="avatar-list"></div>
    </section>

    <section class="panel">
      <h2>Add competition entry</h2>

      <form id="entry-form">
        <label>
          Competition type
          <input
            id="competition-type"
            type="text"
            placeholder="Football, quiz, tennis..."
            required
          >
        </label>

        <label>
          Date
          <input id="competition-date" type="date" required>
        </label>

        <label>
          Notes
          <textarea
            id="competition-notes"
            placeholder="Optional notes"
          ></textarea>
        </label>

        <h3>Points</h3>
        <div id="points-fields"></div>

        <button type="submit">Save competition</button>
      </form>
    </section>

    <section class="panel">
      <h2>Compare avatars</h2>

      <div class="comparison-controls">
        <select id="avatar-one"></select>
        <select id="avatar-two"></select>
        <button id="compare-button">Compare</button>
      </div>

      <div id="comparison-result"></div>
    </section>

    <section class="panel">
      <h2>Points over time</h2>
      <canvas id="points-chart"></canvas>
    </section>

    <section class="panel">
      <h2>Competition history</h2>
      <div id="entry-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
