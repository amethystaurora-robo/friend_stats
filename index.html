<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Competition Statistics</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <h1>Competition Statistics</h1>
    <p>Manage avatars, competitions, points, and statistics.</p>
  </header>

  <main>
<section class="panel avatar-builder">
  <h2>Create an Avatar</h2>

  <form id="avatarForm">
    <label for="avatarName">Avatar name</label>
    <input
      id="avatarName"
      name="avatarName"
      type="text"
      placeholder="Enter avatar name"
      required
    >

    <div class="avatar-builder-layout">
      <div class="avatar-options">

        <fieldset>
          <legend>Skin color</legend>

          <div class="choice-grid">
            <button
              type="button"
              class="choice color-choice selected"
              data-option="skinColor"
              data-value="#f6c7a5"
              style="--choice-color: #f6c7a5"
              aria-label="Light skin"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="skinColor"
              data-value="#e7a977"
              style="--choice-color: #e7a977"
              aria-label="Tan skin"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="skinColor"
              data-value="#ae7048"
              style="--choice-color: #ae7048"
              aria-label="Brown skin"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="skinColor"
              data-value="#70432f"
              style="--choice-color: #70432f"
              aria-label="Dark skin"
            ></button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Hair color</legend>

          <div class="choice-grid">
            <button
              type="button"
              class="choice color-choice selected"
              data-option="hairColor"
              data-value="#24160f"
              style="--choice-color: #24160f"
              aria-label="Black hair"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="hairColor"
              data-value="#f4d35e"
              style="--choice-color: #f4d35e"
              aria-label="Yellow hair"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="hairColor"
              data-value="#ffffff"
              style="--choice-color: #ffffff"
              aria-label="White hair"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="hairColor"
              data-value="#999999"
              style="--choice-color: #999999"
              aria-label="Gray hair"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="hairColor"
              data-value="#8b4513"
              style="--choice-color: #8b4513"
              aria-label="Brown hair"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="hairColor"
              data-value="#f28c28"
              style="--choice-color: #f28c28"
              aria-label="Orange hair"
            ></button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Eye color</legend>

          <div class="choice-grid">
            <button
              type="button"
              class="choice color-choice selected"
              data-option="eyeColor"
              data-value="#222222"
              style="--choice-color: #222222"
              aria-label="Black eyes"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="eyeColor"
              data-value="#2563eb"
              style="--choice-color: #2563eb"
              aria-label="Blue eyes"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="eyeColor"
              data-value="#16a34a"
              style="--choice-color: #16a34a"
              aria-label="Green eyes"
            ></button>

            <button
              type="button"
              class="choice color-choice"
              data-option="eyeColor"
              data-value="#dc2626"
              style="--choice-color: #dc2626"
              aria-label="Red eyes"
            ></button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Accessory</legend>

          <div class="text-choice-grid">
            <button type="button" class="choice text-choice selected"
              data-option="accessory" data-value="none">
              None
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="beard">
              Beard
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="unicorn">
              Unicorn
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="top-hat">
              Top hat
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="halo">
              Halo
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="beret">
              Beret
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="band">
              Band
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="nose-stud">
              Nose stud
            </button>

            <button type="button" class="choice text-choice"
              data-option="accessory" data-value="nose-bullring">
              Bullring
            </button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Accessory color</legend>

          <input
            id="accessoryColor"
            type="color"
            value="#e63946"
            aria-label="Accessory color"
          >
        </fieldset>

        <fieldset>
          <legend>Mouth</legend>

          <div class="text-choice-grid">
            <button type="button" class="choice text-choice selected"
              data-option="mouth" data-value="grinning">
              Grinning
            </button>

            <button type="button" class="choice text-choice"
              data-option="mouth" data-value="braces">
              Braces
            </button>

            <button type="button" class="choice text-choice"
              data-option="mouth" data-value="fangs">
              Fangs
            </button>

            <button type="button" class="choice text-choice"
              data-option="mouth" data-value="frown">
              Frown
            </button>

            <button type="button" class="choice text-choice"
              data-option="mouth" data-value="beak">
              Beak
            </button>

            <button type="button" class="choice text-choice"
              data-option="mouth" data-value="lion">
              Lion
            </button>
          </div>
        </fieldset>

        <button type="submit" class="primary-button">
          Create avatar
        </button>
      </div>

      <div class="preview-container">
        <h3>Preview</h3>
        <div id="avatarPreview"></div>
      </div>
    </div>
  </form>

  <div id="avatarList" class="avatar-list"></div>
</section>


  <h3>Preview</h3>
  <div id="avatar-preview"></div>

  <button type="submit">Create avatar</button>
</form>


    <section class="panel">
      <h2>Avatars</h2>
      <div id="avatar-list" class="avatar-list"></div>
    </section>

    <section class="panel">
      <h2>Add competition entry</h2>

      <form id="entry-form">
        <label>
          Competition type
          <input
            id="competition-type"
            type="text"
            placeholder="Football, quiz, tennis..."
            required
          >
        </label>

        <label>
          Date
          <input id="competition-date" type="date" required>
        </label>

        <label>
          Notes
          <textarea
            id="competition-notes"
            placeholder="Optional notes"
          ></textarea>
        </label>

        <h3>Points</h3>
        <div id="points-fields"></div>

        <button type="submit">Save competition</button>
      </form>
    </section>

    <section class="panel">
      <h2>Compare avatars</h2>

      <div class="comparison-controls">
        <select id="avatar-one"></select>
        <select id="avatar-two"></select>
        <button id="compare-button">Compare</button>
      </div>

      <div id="comparison-result"></div>
    </section>

    <section class="panel">
      <h2>Points over time</h2>
      <canvas id="points-chart"></canvas>
    </section>

    <section class="panel">
      <h2>Competition history</h2>
      <div id="entry-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
