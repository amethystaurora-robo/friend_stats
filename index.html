<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Competition Statistics</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <h1>Competition Statistics</h1>
    <p>Manage avatars, competitions, points, and statistics.</p>
  </header>

  <main>
<form id="avatar-form">
  <input
    id="avatar-name"
    type="text"
    placeholder="Avatar name"
    required
  >

  <h3>Skin color</h3>
  <div id="skin-options" class="choice-grid">
    <button type="button" class="color-choice" data-option="skinColor" data-value="#f6c7a5" style="background:#f6c7a5"></button>
    <button type="button" class="color-choice" data-option="skinColor" data-value="#e0a77a" style="background:#e0a77a"></button>
    <button type="button" class="color-choice" data-option="skinColor" data-value="#b97850" style="background:#b97850"></button>
    <button type="button" class="color-choice" data-option="skinColor" data-value="#75452f" style="background:#75452f"></button>
  </div>

  <h3>Hair color</h3>
  <div id="hair-color-options" class="choice-grid">
    <button type="button" class="color-choice" data-option="hairColor" data-value="#24160f" style="background:#24160f"></button>
    <button type="button" class="color-choice" data-option="hairColor" data-value="#6b3e26" style="background:#6b3e26"></button>
    <button type="button" class="color-choice" data-option="hairColor" data-value="#d49a45" style="background:#d49a45"></button>
    <button type="button" class="color-choice" data-option="hairColor" data-value="#e5c45b" style="background:#e5c45b"></button>
    <button type="button" class="color-choice" data-option="hairColor" data-value="#c94c4c" style="background:#c94c4c"></button>
    <button type="button" class="color-choice" data-option="hairColor" data-value="#7546a8" style="background:#7546a8"></button>
    <button type="button" class="color-choice" data-option="hairColor" data-value="#3d82bd" style="background:#3d82bd"></button>
  </div>

  <h3>Hair style</h3>
  <div class="style-options">
    <button type="button" class="style-choice" data-option="hairStyle" data-value="short">
      Short
    </button>

    <button type="button" class="style-choice" data-option="hairStyle" data-value="spiky">
      Spiky
    </button>

    <button type="button" class="style-choice" data-option="hairStyle" data-value="long">
      Long
    </button>

    <button type="button" class="style-choice" data-option="hairStyle" data-value="none">
      Bald
    </button>
  </div>

  <h3>Eye color</h3>
  <div class="choice-grid">
    <button type="button" class="color-choice" data-option="eyeColor" data-value="#222222" style="background:#222222"></button>
    <button type="button" class="color-choice" data-option="eyeColor" data-value="#356aa0" style="background:#356aa0"></button>
    <button type="button" class="color-choice" data-option="eyeColor" data-value="#4c8c4a" style="background:#4c8c4a"></button>
    <button type="button" class="color-choice" data-option="eyeColor" data-value="#795548" style="background:#795548"></button>
  </div>

  <h3>Accessory</h3>
  <div class="style-options">
    <button type="button" class="style-choice" data-option="accessory" data-value="none">
      None
    </button>

    <button type="button" class="style-choice" data-option="accessory" data-value="glasses">
      Glasses
    </button>

    <button type="button" class="style-choice" data-option="accessory" data-value="headband">
      Headband
    </button>

    <button type="button" class="style-choice" data-option="accessory" data-value="crown">
      Crown
    </button>
  </div>

  <h3>Preview</h3>
  <div id="avatar-preview"></div>

  <button type="submit">Create avatar</button>
</form>


    <section class="panel">
      <h2>Avatars</h2>
      <div id="avatar-list" class="avatar-list"></div>
    </section>

    <section class="panel">
      <h2>Add competition entry</h2>

      <form id="entry-form">
        <label>
          Competition type
          <input
            id="competition-type"
            type="text"
            placeholder="Football, quiz, tennis..."
            required
          >
        </label>

        <label>
          Date
          <input id="competition-date" type="date" required>
        </label>

        <label>
          Notes
          <textarea
            id="competition-notes"
            placeholder="Optional notes"
          ></textarea>
        </label>

        <h3>Points</h3>
        <div id="points-fields"></div>

        <button type="submit">Save competition</button>
      </form>
    </section>

    <section class="panel">
      <h2>Compare avatars</h2>

      <div class="comparison-controls">
        <select id="avatar-one"></select>
        <select id="avatar-two"></select>
        <button id="compare-button">Compare</button>
      </div>

      <div id="comparison-result"></div>
    </section>

    <section class="panel">
      <h2>Points over time</h2>
      <canvas id="points-chart"></canvas>
    </section>

    <section class="panel">
      <h2>Competition history</h2>
      <div id="entry-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
